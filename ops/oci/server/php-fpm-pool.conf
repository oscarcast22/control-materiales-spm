[control-materiales]
user = materiales
group = www-data
listen = /run/php/php8.4-fpm-control-materiales.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
