server {
    listen 80;
    server_name materiales.utopiadigital.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name materiales.utopiadigital.tech;

    root /srv/control-materiales/current/public;
    index index.php;
    client_max_body_size 64m;
    server_tokens off;

    ssl_certificate /etc/ssl/control-materiales/origin.pem;
    ssl_certificate_key /etc/ssl/control-materiales/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/run/php/php8.4-fpm-control-materiales.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
